  <text x="300" y="200" class="label">Correo:</text>
  <rect x="300" y="215" width="360" height="30" rx="4" fill="#f8fafc" stroke="#e5e7eb" />

  <text x="300" y="260" class="label">Biografía</text>
  <rect x="300" y="275" width="360" height="120" rx="6" fill="#fff" stroke="#e5e7eb" />

